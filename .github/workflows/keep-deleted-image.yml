# Only exists in the keep-deleted fork. Upstream builds its images on mau.dev;
# this builds the patched bridge for every tag like v0.2609.0-keep-deleted and
# publishes it as ghcr.io/<owner>/<repo>:<tag>.
name: Build keep-deleted image

on:
  push:
    tags: ["v*-keep-deleted"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Build the image
        run: >-
          docker build
          --label org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          --label org.opencontainers.image.revision=${{ github.sha }}
          --tag "$IMAGE" .

      - name: Push the image
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
          docker push "$IMAGE"
